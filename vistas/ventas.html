<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punto de Venta - Downzon</title>

    <link rel="stylesheet" href="/css/panel.css">
    <link rel="stylesheet" href="/css/ventas.css">

</head>


<body>

      <header class="barra-superior">
        <img
            src="/img/logoDownzon.png"
            alt="Logo Downzon"
            class="logo-panel"
        >

        <div class="usuario-panel">
            <span>Cajero</span>
            <a href="/login/cerrar" class="boton-salir">
                Cerrar sesión
            </a>
        </div>
    </header>   



<main class="contenido-panel contenedor-ventas">
        <section class="encabezado-panel">
            <a href="/cajero" class="volver-panel">← Volver al panel</a>
            <h1>Punto de venta</h1>
            <p>Selecciona productos y registra las ventas de la panadería.</p>
        </section>

    <h2>Productos disponibles</h2>


    <div 
        id="productos"
        class="productos-container">
    </div>




    <div class="carrito-container">


        <h2>
            Carrito de compra
        </h2>



        <div class="contenedor-tabla">
        <table>


            <thead>

                <tr>

                    <th>Producto</th>
                    <th>Cantidad</th>
                    <th>Precio</th>
                    <th>Subtotal</th>

                </tr>

            </thead>



            <tbody id="carrito">

            </tbody>


        </table>
        </div>




        <div class="total">

            Total:
            $
            <span id="total">
                0
            </span>

        </div>




        <div class="pago-container">


            <label>
                Pago recibido:
            </label>


            <input 
                type="number"
                id="pago"
                oninput="calcularCambio()"
            >


        </div>




        <div class="total">

            Cambio:
            $
            <span id="cambio">
                0
            </span>

        </div>




        <button 
            class="btn-finalizar"
            onclick="finalizarVenta()">

            Finalizar venta

        </button>



    </div>


</main>



<script src="/js/ventas.js"></script>


</body>

</html>
