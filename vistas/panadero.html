<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar producción - Downzon</title>
    <link rel="stylesheet" href="/css/panel.css">
    <link rel="stylesheet" href="/css/panadero.css">
</head>
<body>
    <header class="barra-superior">
        <img src="/img/logoDownzon.png" alt="Logo Downzon" class="logo-panel">
        <div class="usuario-panel">
            <span id="nombre-panadero">Panadero</span>
            <a href="/login/cerrar" class="boton-salir">Cerrar sesión</a>
        </div>
    </header>
    <main class="contenido-panel">
        <section class="encabezado-panel">
            <a href="/panadero" class="volver-panel">← Volver al panel</a>
            <h1>Registrar producción</h1>
            <p>Registra los productos elaborados y su fecha de consumo preferente.</p>
        </section>
        <div id="alerta-vencimientos" class="alerta-vencimientos" style="display:none;"></div>
        <section class="dashboard-grid">
            <div class="card">
                <h3>Datos de producción</h3>
                <form id="form-produccion" action="/panadero/produccion/registrar" method="POST">
                    <div class="form-group">
                        <label for="producto">Producto Elaborado:</label>
                        <select name="id_producto" id="producto" required>
                            <option value="">Selecciona un producto...</option>
                            <option value="1">Concha</option>
                            <option value="2">Cuernito</option>
                            <option value="3">Dona de chocolate</option>
                            <option value="4">Bolillo</option>
                            <option value="5">Pan dulce</option>
                            <option value="6">Pastel</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="cantidad">Cantidad Producida:</label>
                        <input type="number" name="cantidad" id="cantidad" min="1" placeholder="Ej. 30" required>
                    </div>

                    <div class="form-group">
                        <label for="fecha_consumo_preferente">Consumo preferente hasta:</label>
                        <input type="date" name="fecha_consumo_preferente" id="fecha_consumo_preferente" required>
                    </div>

                    <button type="submit" class="btn-submit">Guardar Producción</button>
                </form>
            </div>

        </section>
    </main>
    <script src="/js/panadero.js"></script>
</body>
</html>
